<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conway’s Game of Life</title><style>*{box-sizing:border-box}body{margin:0;background:#07111e;color:#f0f7ff;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 75% 20%,#0b385080,transparent 55%);pointer-events:none}header{position:relative;padding:28px max(4vw,20px) 16px;display:flex;justify-content:space-between;align-items:center;gap:15px}small,.eyebrow{color:#69d4dc;text-transform:uppercase;letter-spacing:.19em;font-size:11px;font-weight:700}h1{font-size:clamp(24px,3.2vw,43px);margin:5px 0 0;line-height:1.14;letter-spacing:-.035em}.tag{border:1px solid #357388;color:#82dce4;border-radius:100px;padding:8px 12px;white-space:nowrap;font-size:12px}main{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;padding:12px max(4vw,20px) 22px;max-width:1600px;margin:auto}.stage{background:#0a1728;border:1px solid #25415a;border-radius:22px;overflow:hidden;position:relative;min-height:490px;display:flex;align-items:center;justify-content:center}.stage canvas{display:block;width:100%;height:100%;min-height:490px}.controls{background:#0b1b2c;border:1px solid #25415a;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px}button,select{color:#f3fdff;border-radius:9px;background:#17334b;border:1px solid #38617b;padding:10px 11px;cursor:pointer;font:inherit}button:hover{background:#24506b}button.primary{background:#19b8bf;border-color:#19b8bf;color:#031821;font-weight:700}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.buttons button:first-child{grid-column:span 2}.control{margin:5px 0}.control label{display:flex;justify-content:space-between;font-size:13px;color:#b8d4e2;margin:0 0 6px}.control input{width:100%;accent-color:#30d5da}.metric{padding:13px;border:1px solid #28465e;border-radius:12px;background:#0c2436;font-variant-numeric:tabular-nums}.metric b{font-size:24px;color:#f3fcff}.metric small{display:block;letter-spacing:.1em;margin-bottom:4px}.note{color:#b3c7d7;font-size:13px}.legend{display:flex;gap:12px;flex-wrap:wrap;color:#b4d0df;font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}footer{max-width:1500px;margin:0 auto;padding:0 max(4vw,20px) 26px;color:#7898ae;font-size:12px}a{color:#62d7df}@media(max-width:870px){main{grid-template-columns:1fr}.stage,.stage canvas{min-height:380px}header{flex-wrap:wrap}.controls{display:grid;grid-template-columns:1fr 1fr}.note{grid-column:1/-1}} .control select,.control input[type=number]{width:100%} .hint{border-left:3px solid #26d3d6;padding:8px 12px;background:#112b3c;font-size:13px;color:#bfd6e3} .control input[type=checkbox]{width:auto} .stage canvas{touch-action:none}.metric b{font-size:20px}.pill{padding:4px 8px;border-radius:12px;background:#1b3547}button:focus-visible{outline:2px solid #f1c77d}</style></head><body><header><div><div class="eyebrow">COMPLEXITY LAB V2 · CELLULAR AUTOMATA</div><h1>Conway’s Game of Life</h1></div><div class="tag">OFFLINE · INTERACTIVE · V2</div></header><main><div class="stage"><canvas id="viz"></canvas></div><aside class="controls"><div class="buttons"><button id="play" class="primary" onclick="toggle()">Pause</button><button onclick="reset()">Reset</button><button onclick="stepOnce()">Step →</button></div><div class="control"><label>Initial configuration</label><select id="preset"><option value="Multiple">Multiple</option><option value="Glider">Glider</option><option value="Gun">Gun</option><option value="Rpentomino">Rpentomino</option><option value="Blinker">Blinker</option><option value="Block">Block</option><option value="Random">Random</option><option value="Empty">Empty</option></select></div><div class="control"><label>Boundary conditions</label><select id="boundary"><option value="Toroidal">Toroidal / wraparound</option><option value="Fixed">Fixed / dead outside</option><option value="Reflective">Reflective / mirrored</option></select></div><div class="control"><label for="speed">Evolution speed<span id="speedv">10</span></label><input id="speed" type="range" min="1" max="16" value="10" step="1" oninput="$('speedv').textContent=this.value"></div><div class="control"><label for="density">Random initial density (%)<span id="densityv">22</span></label><input id="density" type="range" min="1" max="90" value="22" step="1" oninput="$('densityv').textContent=this.value"></div><button onclick="randomize()">Randomize</button><p class="hint">Try Fixed vs Toroidal boundaries; vary presets and draw your own patterns.</p></aside></main><footer>Exact Conway B3/S23 model; boundary conventions are explicit. · Source code is editable. Press F11 for presentation mode.</footer><script>const cvs=document.getElementById('viz'),c=cvs.getContext('2d');let W=1000,H=600,run=true,t=0;function resize(){let b=cvs.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cvs.width=Math.round(b.width*d);cvs.height=Math.round(b.height*d);c.setTransform(d,0,0,d,0,0);W=b.width;H=b.height;}window.addEventListener('resize',resize);resize();function bg(){c.fillStyle='#081522';c.fillRect(0,0,W,H)}function txt(s,x,y,size=16,color='#d0e5f2',align='left'){c.fillStyle=color;c.font=`${size}px system-ui`;c.textAlign=align;c.fillText(s,x,y)}function line(x,y,X,Y,color='#49cbd1',w=2){c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.strokeStyle=color;c.lineWidth=w;c.stroke()}function circle(x,y,r,col){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=col;c.fill()}const $=id=>document.getElementById(id);function toggle(){run=!run;$('play').textContent=run?'Pause':'Play'}function loop(){if(run){t++;step()}draw();requestAnimationFrame(loop)}
const C=86,R=54;let a=[],gen=0,drag=false;const patterns={Glider:[[1,0],[2,1],[0,2],[1,2],[2,2]],Blinker:[[0,0],[1,0],[2,0]],Block:[[0,0],[1,0],[0,1],[1,1]],Rpentomino:[[1,0],[2,0],[0,1],[1,1],[1,2]],Gun:[[24,0],[22,1],[24,1],[12,2],[13,2],[20,2],[21,2],[34,2],[35,2],[11,3],[15,3],[20,3],[21,3],[34,3],[35,3],[0,4],[1,4],[10,4],[16,4],[20,4],[21,4],[0,5],[1,5],[10,5],[14,5],[16,5],[17,5],[22,5],[24,5],[10,6],[16,6],[24,6],[11,7],[15,7],[12,8],[13,8]]};
function place(kind,x,y){for(const [dx,dy] of patterns[kind]||[])if(a[y+dy]&&x+dx>=0&&x+dx<C)a[y+dy][x+dx]=1}
function reset(){a=Array.from({length:R},()=>new Uint8Array(C));gen=t=0;let kind=$('preset').value;if(kind==='Random')randomize();else if(kind==='Multiple'){place('Block',12,14);place('Blinker',35,11);place('Glider',56,25);place('Rpentomino',25,30)}else if(kind!=='Empty')place(kind,kind==='Gun'?15:22,kind==='Gun'?13:20)}
function randomize(){let p=Number($('density').value)/100;for(let y=0;y<R;y++)for(let x=0;x<C;x++)a[y][x]=Math.random()<p?1:0;gen=0}
function lookup(x,y){let bc=$('boundary').value;if(bc==='Toroidal')return a[(y+R)%R][(x+C)%C];if(bc==='Reflective'){x=x<0?-x:x>=C?2*C-2-x:x;y=y<0?-y:y>=R?2*R-2-y:y;return a[y]?.[x]??0}return a[y]?.[x]??0}
function next(){let b=Array.from({length:R},()=>new Uint8Array(C));for(let y=0;y<R;y++)for(let x=0;x<C;x++){let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy)n+=lookup(x+dx,y+dy);b[y][x]=a[y][x]?(n===2||n===3?1:0):(n===3?1:0)}a=b;gen++}
function step(){if(t%Math.max(2,19-Number($('speed').value))===0)next()}function stepOnce(){next()}
function paint(e){let b=cvs.getBoundingClientRect(),s=Math.min((W-20)/C,(H-75)/R),ox=(W-C*s)/2,oy=51+(H-75-R*s)/2,x=Math.floor((e.clientX-b.left-ox)/s),y=Math.floor((e.clientY-b.top-oy)/s);if(a[y]&&x>=0&&x<C)a[y][x]=e.buttons===2?0:1}
cvs.addEventListener('pointerdown',e=>{drag=true;paint(e)});cvs.addEventListener('pointermove',e=>{if(drag)paint(e)});window.addEventListener('pointerup',()=>drag=false);cvs.addEventListener('contextmenu',e=>e.preventDefault());
function draw(){bg();let s=Math.min((W-20)/C,(H-75)/R),ox=(W-C*s)/2,oy=51+(H-75-R*s)/2,alive=0;c.fillStyle='#102233';c.fillRect(ox,oy,C*s,R*s);for(let y=0;y<R;y++)for(let x=0;x<C;x++){if(a[y][x]){alive++;c.fillStyle='#59d9d8';c.fillRect(ox+x*s+.5,oy+y*s+.5,Math.max(1,s-1),Math.max(1,s-1))}else if(s>6){c.fillStyle='#1c3342';c.fillRect(ox+x*s+s*.48,oy+y*s+s*.48,1,1)}}txt('GEN '+gen+' · ALIVE '+alive,20,28,17,'#e9f5ff');txt($('boundary').value.toUpperCase()+' BOUNDARY',W-20,28,13,'#84bbca','right');txt('Click or drag to draw · right click to erase · compare boundary conditions',W/2,H-14,13,'#a2c6d3','center')}
$('preset').value='Multiple';$('preset').addEventListener('change',reset);$('boundary').addEventListener('change',()=>{gen=0});reset();loop();</script></body></html>
